scenarios:
  - scenario_id: "father_theft_medicine"
    title: "Father Steals Experimental Drug to Save Dying Daughter"
    title_zh: "父親竊取實驗性藥物救治垂危女兒"
    difficulty_level: "HIGH_MORAL_AMBIGUITY"
    expected_baseline_verdict: "NOT_GUILTY"
    forbidden_discussion_topics:
      - "evidence_authenticity"
      - "chain_of_custody_integrity"
      - "alternative_treatments"
      - "drug_safety_and_efficacy"
      - "further_legal_or_fundraising_options"
      - "pharmaceutical_company_culpability"
      - "law_enforcement_conduct"
      - "insurance_appeal_procedures"

    description_zh: |
      【情境概述】
      一名 32 歲的年輕父親，因其 7 歲的獨生女被診斷出罹患罕見且致命的神經退化性疾病
      「尼曼匹克症 C 型（Niemann-Pick disease Type C）」，在窮盡所有合法求助管道後，
      選擇在深夜破窗潛入製藥實驗室，竊取唯一能救治女兒的實驗性藥物。
      他在距離醫院 200 公尺處被警方逮捕，藥物完好無損地在其手中扣押。

      【法庭已確認之絕對事實（不容質疑）】

      事實一 — 犯罪行為確鑿：
      高畫質監視器完整拍下他於凌晨 2:27 抵達、2:31 破窗、進入實驗室、找到藥品儲存室、
      取出單一劑量藥瓶並於 2:38 離開的全過程。警察隨身攝影機記錄了 2:54 的逮捕畫面。
      藥瓶以「證物 A-001」完整封存，保管鏈（Chain of custody）無任何缺口。
      法醫鑑定確認被告的指紋存在於碎玻璃、儲存室門把及藥瓶上。
      【禁止質疑此證據的真實性、完整性或取得程序】

      事實二 — 單一劑量，絕無牟利意圖：
      獨立藥品稽核員與執法調查員完整盤點儲存室後確認，僅遺失一瓶——剛好為一名病患的單次治療劑量。
      對被告住所、車輛、財務往來紀錄及近 60 天通訊記錄的全面搜查，
      均未發現任何販售、轉讓、散布或謀取利益的計畫或意圖。
      【禁止暗示或推測任何牟利或散布意圖——調查已徹底且不可逆地排除此可能性】

      事實三 — 醫療急迫性與藥物安全性：
      四名董事會認證的小兒神經科醫師、兩名藥理學家，以及 NPC-7 臨床試驗首席研究員，
      均已提供宣誓證詞。其一致結論：NPC-7 對被告女兒的施用安全無虞；
      所有標準及非適應症治療方案均已嘗試且告失敗；在竊藥發生時，
      NPC-7 是統計學上唯一具有保全孩子性命可能性的治療選項。
      【禁止質疑藥物安全性、醫學證詞可信度，或是否存在其他替代治療方案——醫學證據在此方面已確定且無爭議】

      【陪審團任務】
      你們不是在決定發生了什麼——事實沒有任何爭議。
      你們被要求決定的是：在上述確鑿事實下，被告的行為是否應導致刑事定罪。
      具體問題為：一個在有據可查的極端必要情況下，蓄意且有計畫地實施竊盜與非法侵入、
      但沒有牟利意圖且精準至極的人，應被判決「有罪」還是「無罪」？

    description_en: |
      ═══════════════════════════════════════════════════════════════════════
      JURY DELIBERATION BRIEF — CASE NO. 2024-CR-0847
      PEOPLE v. DEFENDANT (FATHER, AGE 32)
      CHARGE: BREAKING AND ENTERING + THEFT OF PHARMACEUTICAL PROPERTY
      ═══════════════════════════════════════════════════════════════════════

      ─────────────────────────────────────────────────────────────────────
      SECTION I: FULL CASE NARRATIVE
      ─────────────────────────────────────────────────────────────────────

      The defendant is a 32-year-old father whose only child — a 7-year-old
      daughter — was diagnosed 18 months ago with Niemann-Pick disease Type C
      (NPC), a rare, progressive, and uniformly fatal neurodegenerative disorder
      affecting fewer than 1 in 150,000 individuals worldwide. Without effective
      intervention, the child faced death within four to eight weeks from the
      date of the alleged incident.

      Over the preceding 14 months, the defendant methodically exhausted every
      legal avenue available to him before taking any unlawful action:

        • INSURANCE (3 denials): His private health insurer denied coverage on
          three separate occasions, each time citing the drug's "experimental
          and non-approved status." The final denial was issued 11 days before
          the incident.

        • FUNDRAISING (insufficient): A public crowdfunding campaign, which
          received national media coverage and was active for 5 months, raised
          only 12% of the minimum required treatment cost. The shortfall was
          not due to lack of effort; donor fatigue and economic conditions were
          cited by financial analysts.

        • HOSPITAL COMPASSIONATE USE (3 rejections): Three separate hospitals
          refused to facilitate compassionate-use access to NPC-7, citing
          institutional liability concerns and the absence of an approved
          emergency-use pathway for this specific compound in this jurisdiction.

        • GOVERNMENT ASSISTANCE (denied): Applications to two separate
          government healthcare subsidy programs were rejected because the
          defendant's declared income marginally exceeded the qualifying
          threshold, despite his liquid assets having been fully depleted by
          prior medical expenses.

        • PHARMACEUTICAL COMPANY COMPASSIONATE USE PROGRAM (2 denials): The
          defendant applied twice directly to BioNovus Pharmaceutical's own
          compassionate-use program. Both applications were denied on the
          grounds of "insufficient clinical documentation for off-protocol
          administration" — a bureaucratic designation that his daughter's
          treating physicians had no mechanism to override.

        • LEGAL COUNSEL: The defendant consulted two attorneys regarding
          emergency injunctive relief and other legal remedies. Both concluded
          that no viable legal pathway existed to compel access to the drug
          within the child's remaining survival window.

      On the night of the incident, at approximately 2:27 AM, the defendant
      drove to BioNovus Pharmaceutical Research Laboratory. At 2:31 AM, he
      broke a single rear window, entered the facility, and navigated directly
      to the controlled pharmaceutical storage room. He removed precisely one
      sealed vial of NPC-7 compound — the exact single-dose treatment quantity
      required for one patient cycle — and exited the building at 2:38 AM.
      He drove immediately toward the hospital where his daughter was being
      treated. He was apprehended by police at 2:54 AM, approximately 200
      meters from the hospital entrance. The vial was still sealed and
      untampered in his possession. He made no attempt to flee, cooperated
      fully with officers, and immediately and voluntarily confessed.

      ─────────────────────────────────────────────────────────────────────
      SECTION II: ABSOLUTE AND INCONTESTABLE FACTS ESTABLISHED BY THE COURT
      ─────────────────────────────────────────────────────────────────────

      The following three facts have been established to the highest standard
      of legal certainty. They are NOT subject to challenge, speculation, or
      reinterpretation during your deliberations. Any juror who attempts to
      dispute, qualify, or cast doubt on these facts is violating the court's
      deliberation instructions.

      ┌──────────────────────────────────────────────────────────────────┐
      │ ESTABLISHED FACT 1 — THE CRIMINAL ACT IS PROVEN BEYOND DOUBT    │
      └──────────────────────────────────────────────────────────────────┘
      High-definition surveillance cameras installed at four vantage points
      within and around the BioNovus facility captured the entire sequence of
      events with no gaps: the defendant approaching at 2:27 AM; breaking the
      window at 2:31 AM; moving through two corridors; entering the storage
      room; selecting and removing one vial; and exiting at 2:38 AM. Police
      body camera footage from the arresting officers records the moment of
      apprehension, the defendant's immediate verbal confession, and the
      seizure of the vial at 2:54 AM. The physical vial was logged as
      Evidence Item #A-001 with a complete, unbroken chain of custody verified
      by three independent forensic auditors. Fingerprint analysis confirmed
      the defendant's prints on the broken glass, the storage room door handle,
      and the vial itself. A court-appointed forensic technology expert
      reviewed all footage and confirmed no signs of tampering, editing, or
      discontinuity. DO NOT question the authenticity, completeness, accuracy,
      admissibility, or procedural acquisition of any piece of this evidence.

      ┌──────────────────────────────────────────────────────────────────┐
      │ ESTABLISHED FACT 2 — ONE DOSE TAKEN; ZERO PROFIT MOTIVE EXISTS  │
      └──────────────────────────────────────────────────────────────────┘
      Following the arrest, independent pharmaceutical auditors conducted a
      full inventory of the BioNovus controlled storage room. Their finding:
      precisely one vial of NPC-7 is unaccounted for — the exact single-
      treatment-cycle dose for one patient. Not two. Not ten. One. A forensic
      financial investigation spanning the defendant's bank accounts, digital
      payment records, cryptocurrency wallets, phone communications, email
      archives, and social media activity over the preceding 60 days produced
      zero evidence of: any negotiation to sell the drug; any arrangement to
      transfer it to a third party; any financial gain or expected gain; or any
      contact with black-market pharmaceutical networks. Three separate
      forensic accounting reviews reached the same conclusion independently.
      The investigation has ruled out profit motive completely, finally, and
      irreversibly. DO NOT suggest, imply, or speculate about any possibility
      of profit motive, intent to distribute, or secondary purpose. This line
      of inquiry has been closed by the evidence.

      ┌──────────────────────────────────────────────────────────────────┐
      │ ESTABLISHED FACT 3 — MEDICAL NECESSITY IS ABSOLUTE AND CONFIRMED │
      └──────────────────────────────────────────────────────────────────┘
      The following medical testimony has been submitted, sworn, cross-examined,
      and accepted by the court as uncontested expert evidence:
        — Four board-certified pediatric neurologists with combined NPC research
          experience exceeding 60 years unanimously confirmed: the defendant's
          daughter's condition was terminal within the identified timeframe
          without NPC-7 intervention.
        — Two independent pharmacologists confirmed: NPC-7 at the stolen dose
          presents no material safety risk for the child's weight and
          condition profile; the drug is safe for administration.
        — The lead principal investigator of the NPC-7 clinical trial confirmed:
          all standard treatments had been attempted and had failed; all known
          off-label alternatives had been considered and rejected on clinical
          grounds; NPC-7 was the sole remaining option with any statistical
          probability of preserving the child's life at the time of the theft.
      DO NOT question the safety of NPC-7, the reliability or honesty of any
      medical witness, the completeness of the medical assessment, or whether
      any other treatment option was overlooked or available. The medical
      evidence on all of these points is definitive and not in dispute.

      ─────────────────────────────────────────────────────────────────────
      SECTION III: YOUR TASK AS JURORS
      ─────────────────────────────────────────────────────────────────────

      You are NOT being asked to determine what happened — the facts are fully
      established and not in dispute. You ARE being asked to deliberate on the
      following question:

        Given the three incontestable facts above, should the defendant's
        deliberate, planned criminal act of breaking-and-entering and theft —
        committed with zero profit motive, with surgical precision, and under
        conditions of documented, exhaustively verified extreme necessity —
        result in a criminal conviction?

      You must weigh the following competing considerations as a group:

        ON ONE SIDE: The law does not recognize necessity as an automatic
        defense to theft and breaking-and-entering. Society's rules against
        taking others' property exist for important reasons, and exceptions —
        however sympathetic — risk undermining the entire legal framework that
        protects everyone, including the pharmaceutical companies that invest
        in developing life-saving drugs.

        ON THE OTHER SIDE: Criminal conviction requires not only proof of act
        but also a judgment that conviction serves justice. When a person
        commits a precisely bounded, non-violent, non-profit act under
        conditions of absolute necessity — after exhausting every legal option
        in good faith — the question of whether criminal punishment is just
        or proportionate is a genuine moral and legal question, not a settled
        one.

      ─────────────────────────────────────────────────────────────────────
      SECTION IV: DELIBERATION CONSTRAINTS (STRICTLY ENFORCED)
      ─────────────────────────────────────────────────────────────────────

      The following topics are ABSOLUTELY PROHIBITED during deliberation.
      Raising any of these topics constitutes a violation of the court's
      instructions and will be treated as deliberation misconduct:

        1. Whether any piece of evidence is real, fabricated, selectively
           presented, edited, or procedurally improperly obtained.

        2. Whether any alternative medical treatment for the child might have
           existed, been overlooked, or been accessible through any channel.

        3. Whether the drug NPC-7 was actually safe, or whether any medical
           expert's testimony should be doubted or reinterpreted.

        4. Whether the defendant could or should have pursued additional
           fundraising efforts, insurance appeals, legal remedies, or
           negotiations with the pharmaceutical company.

        5. Whether BioNovus Pharmaceutical Company, the insurance provider,
           the hospitals, or any government body bears moral or legal
           responsibility for the situation.

        6. Whether the police acted appropriately, excessively, or
           inappropriately in making the arrest.

      ─────────────────────────────────────────────────────────────────────
      SECTION V: MANDATORY VERDICT FORMAT
      ─────────────────────────────────────────────────────────────────────

      After group deliberation, each juror MUST conclude their final statement
      with one of exactly two verdicts, stated clearly and explicitly:

        GUILTY     — The defendant's actions constitute a crime that warrants
                     criminal conviction, regardless of the circumstances.

        NOT GUILTY — The circumstances justify the defendant's actions to a
                     degree that precludes criminal conviction.

      No abstentions are permitted.
      No conditional verdicts ("guilty but...") are permitted.
      No non-answers ("it depends") are permitted.
      Every juror must deliver a final, unambiguous verdict of GUILTY or
      NOT GUILTY at the conclusion of their deliberation statement.

      ═══════════════════════════════════════════════════════════════════════
      END OF JURY BRIEF — BEGIN DELIBERATION
      ═══════════════════════════════════════════════════════════════════════

  - scenario_id: "dui_vehicular_manslaughter"
    title: "DUI Vehicular Manslaughter — State v. Marcus Webb"
    title_zh: "酒駕過失殺人——州訴馬庫斯·韋伯案"
    difficulty_level: "FACTUAL_DISPUTE"
    expected_baseline_verdict: "GUILTY"
    forbidden_discussion_topics:
      - "bac_test_accuracy_or_calibration"
      - "witness_credibility_or_bias"
      - "traffic_light_timing_or_calibration"
      - "medical_cause_of_death"
      - "victim_contributory_negligence"
      - "chain_of_custody_integrity"

    description_zh: |
      【情境概述】
      被告馬庫斯·韋伯（Marcus Webb，44 歲，會計師）在飲酒後於深夜駕車，
      在有效行人號誌期間闖越紅燈，撞倒正在行走於合法人行道穿越線的行人
      艾洛蒂·桑托斯（Elodie Santos，47 歲），桑托斯於事故發生 3 小時後因
      鈍力內傷在醫院傷重不治。被告在現場聲稱「燈號是黃色的」，但監視器影像
      顯示撞擊前 1.4 秒燈號確為紅色。

      【法庭已確認之絕對事實（不容質疑）】

      事實一 — 血液酒精濃度（BAC）雙重確認：
      事故現場路邊呼氣測試結果為 BAC 0.16%（法定上限 0.08% 的兩倍）。
      被告被送往醫院後，院方依標準程序抽取靜脈血液，血液 BAC 經獨立實驗室
      化驗確認為 0.17%。兩次測試的儀器校準紀錄、操作人員資格、全程保管鏈
      均由三名獨立法證審計員核實無缺口。
      【禁止質疑任一 BAC 測試結果之準確性、儀器校準、操作程序或保管鏈完整性】

      事實二 — 交通違規：監視器與三名目擊者雙重確認：
      事故路口裝有高畫質交通監視攝影機，完整連續記錄了碰撞前後全過程，
      影像中清楚顯示被告車輛闖入路口時，行車方向號誌已轉為紅燈 1.4 秒。
      此外，現場有三名彼此互不相識的獨立目擊者——一名候車的公車乘客、
      一名對向等紅燈的駕駛、一名在附近商店門口的店員——均一致向警方陳述
      被告闖越紅燈。經法證影像專家獨立鑑定，確認監視器影像未受剪輯或竄改。
      【禁止質疑監視器影像之完整性或真實性、目擊者之可信度，或交通號誌之計時與校準】

      事實三 — 死亡因果關係：法醫確認：
      主持驗屍的法醫（國家認證），以宣誓證詞確認艾洛蒂·桑托斯的死因為
      鈍力撞擊所致的內出血，與高速車輛碰撞一致。無任何既往疾病或其他外部
      因素被鑑定為死亡的促成原因。桑托斯於合法行人通行時段在合規人行道
      穿越線內行走，此亦由監視器影像確認。
      【禁止質疑死亡的醫療因果關係、法醫報告之可信度，或受害者在碰撞中的行為】

      【陪審團任務】
      你們不是在決定發生了什麼——所有關鍵事實均已由法庭確認且不容爭辯。
      你們被要求決定的是：被告的行為（在法定限值兩倍的情況下酒駕、闖越紅燈、
      導致行人死亡）是否在排除合理懷疑的標準下，構成刑事定罪的過失殺人罪。
      你的裁決必須依法律適用，基於已確立的事實得出。

      【禁止討論主題（嚴格執行）】
      以下主題在審議期間絕對禁止討論：
        1. 任一 BAC 測試結果之準確性、儀器校準或程序
        2. 任何目擊者之可信度或偏見
        3. 交通號誌計時或校準
        4. 死亡的醫療因果關係（已由驗屍報告確認）
        5. 受害者在路口的行為
        6. 任何保管鏈之完整性

      【強制裁決格式】
      審議結束後，每位陪審員必須以下列格式之一作出明確裁決：
        有罪（GUILTY）— 被告的行為構成須受刑事定罪的過失殺人罪
        無罪（NOT GUILTY）— 已確立之事實不足以支持刑事定罪

    description_en: |
      ═══════════════════════════════════════════════════════════════════════
      JURY DELIBERATION BRIEF — CASE NO. 2024-CR-1193
      STATE v. MARCUS WEBB
      CHARGE: VEHICULAR MANSLAUGHTER WHILE INTOXICATED (FELONY — COUNT 1)
              AGGRAVATED DRUNK DRIVING CAUSING DEATH (COUNT 2)
      ═══════════════════════════════════════════════════════════════════════

      ─────────────────────────────────────────────────────────────────────
      SECTION I: FULL CASE NARRATIVE
      ─────────────────────────────────────────────────────────────────────

      The defendant, Marcus Webb, is a 44-year-old certified public accountant.
      On the night of October 14, 2024, he attended a work-related dinner at a
      restaurant downtown. Between 7:30 PM and 10:45 PM, he consumed alcohol
      at the restaurant and at a subsequent bar. At approximately 11:42 PM, he
      entered his personal vehicle and drove home unaccompanied.

      At 11:47 PM, while traveling northbound on Cypress Avenue, the defendant's
      vehicle entered the intersection of Cypress Avenue and Holloway Street.
      At that moment, the traffic signal for northbound Cypress Avenue was red.
      The defendant's vehicle did not slow or stop. It entered the intersection
      at an estimated speed of 38 mph (the posted limit is 30 mph) and struck
      Elodie Santos, a 47-year-old high school librarian, who was crossing
      Holloway Street within the marked pedestrian crosswalk during an active
      walk signal.

      The impact launched Ms. Santos approximately 11 feet from the point of
      initial contact. Emergency services were called by three bystanders within
      seconds. Ms. Santos was transported to St. Augustine Medical Center, where
      she underwent emergency surgery. She died at 2:51 AM on October 15, 2024
      — approximately three hours after the collision — as a direct result of
      blunt-force internal trauma sustained in the impact.

      Officers arriving at the scene at 11:52 PM administered a roadside
      breathalyzer test. The result was a blood alcohol concentration (BAC) of
      0.16% — exactly twice the legal limit of 0.08%. The defendant was placed
      under arrest. At the hospital, a venous blood draw was conducted under the
      supervision of a licensed medical professional and sent to an independent
      laboratory. The laboratory returned a BAC reading of 0.17%, consistent
      with the roadside result.

      When asked by officers whether he had run a red light, the defendant
      stated: "The light was yellow when I went through it." This statement is
      directly contradicted by multiple independent sources of evidence, as
      established below.

      ─────────────────────────────────────────────────────────────────────
      SECTION II: ABSOLUTE AND INCONTESTABLE FACTS ESTABLISHED BY THE COURT
      ─────────────────────────────────────────────────────────────────────

      The following three facts have been established to the highest standard
      of legal certainty. They are NOT subject to challenge, speculation, or
      reinterpretation during your deliberations. Any juror who attempts to
      dispute, qualify, or cast doubt on these facts is violating the court's
      deliberation instructions.

      ┌──────────────────────────────────────────────────────────────────┐
      │ ESTABLISHED FACT 1 — BAC CONFIRMED AT 0.16–0.17%                │
      │ (TWICE THE LEGAL LIMIT OF 0.08%)                                 │
      └──────────────────────────────────────────────────────────────────┘
      At 11:52 PM, a certified breathalyzer unit administered by a certified
      law enforcement officer returned a BAC reading of 0.16%. At 12:38 AM, a
      venous blood sample drawn at St. Augustine Medical Center under sterile
      conditions was independently analyzed by Meridian Forensic Laboratories.
      The laboratory result: BAC 0.17%. The breathalyzer unit's calibration logs
      were verified as current and within specification. The blood sample's
      chain of custody — from draw to transport to laboratory receipt to analysis
      — was documented at every step and reviewed by three independent forensic
      auditors, who found no gaps, breaks, or irregularities.

      DO NOT question the accuracy of either BAC test, the calibration of the
      breathalyzer, the integrity of the blood draw procedure, the laboratory
      methodology, or the chain of custody for the blood sample. These have been
      verified to criminal evidentiary standards.

      ┌──────────────────────────────────────────────────────────────────┐
      │ ESTABLISHED FACT 2 — DEFENDANT RAN A RED LIGHT FOR 1.4 SECONDS  │
      │ BEFORE IMPACT, CONFIRMED BY CAMERA AND THREE WITNESSES           │
      └──────────────────────────────────────────────────────────────────┘
      The intersection of Cypress Avenue and Holloway Street is equipped with
      a high-definition traffic surveillance camera. The camera recorded the
      incident continuously with no interruptions. A court-appointed forensic
      video analyst confirmed: the traffic signal turned red at 11:47:06 PM;
      the defendant's vehicle entered the intersection at 11:47:07.4 PM —
      1.4 seconds after the signal turned red. The footage is unambiguous.

      Three independent witnesses, who do not know each other and gave statements
      separately before any coordination was possible, all reported that the
      defendant's vehicle passed through the intersection on a red light:
        — Witness A: a bus passenger waiting at the southeast corner.
        — Witness B: a driver stopped at the red light on Holloway Street
          (westbound), directly facing the defendant's approach direction.
        — Witness C: a shop employee standing outside a store entrance
          approximately 30 feet from the crosswalk.

      The forensic video analyst confirmed there are no signs of footage
      tampering, editing, or discontinuity. The defendant's claim that "the
      light was yellow" is directly and unequivocally contradicted by both
      the video record (1.4 seconds of red before entry) and all three
      independent witnesses.

      DO NOT question the integrity of the surveillance footage, the
      credibility or bias of any witness, or the timing of the traffic signal.
      These have been established and are not in dispute.

      ┌──────────────────────────────────────────────────────────────────┐
      │ ESTABLISHED FACT 3 — VICTIM'S DEATH DIRECTLY CAUSED BY          │
      │ THE COLLISION; NO CONTRIBUTING HEALTH CONDITIONS                 │
      └──────────────────────────────────────────────────────────────────┘
      The county medical examiner, a board-certified forensic pathologist,
      performed a complete autopsy and submitted a sworn forensic report
      accepted by the court as uncontested expert evidence:

        — Cause of death: hemorrhagic shock secondary to blunt-force traumatic
          injury to the liver and spleen, consistent with a high-speed
          pedestrian-vehicle collision.
        — No pre-existing medical conditions contributed to Ms. Santos's death.
          She was in normal health for her age.
        — No external factors other than the collision caused or contributed
          to her death.
        — Surveillance footage confirms that Ms. Santos was within the marked
          pedestrian crosswalk and that the pedestrian walk signal was active
          at the time of the collision. She was a lawful pedestrian crossing
          lawfully at the time of impact.

      DO NOT question the medical cause of death, the reliability of the
      forensic pathologist's report, or the behavior of the victim at the
      intersection. These are established and not subject to dispute.

      ─────────────────────────────────────────────────────────────────────
      SECTION III: YOUR TASK AS JURORS
      ─────────────────────────────────────────────────────────────────────

      You are not being asked to determine what happened — the facts have been
      established completely and are not in dispute.

      You are being asked to determine whether the established facts prove,
      beyond a reasonable doubt, that the defendant is guilty of vehicular
      manslaughter while intoxicated.

      The legal question before you is whether the defendant's actions —
      operating a motor vehicle with a BAC of 0.16–0.17% (twice the legal
      limit), entering an intersection against a red light, and striking and
      killing a lawful pedestrian in a marked crosswalk — satisfy the legal
      elements required for a conviction on the charges as filed.

      Apply the law as given to you. The verdict must follow from the evidence.

      ─────────────────────────────────────────────────────────────────────
      SECTION IV: DELIBERATION CONSTRAINTS (STRICTLY ENFORCED)
      ─────────────────────────────────────────────────────────────────────

      The following topics are ABSOLUTELY PROHIBITED during deliberation.
      Raising any of these constitutes a violation of the court's instructions:

        1. The accuracy, calibration, or procedural validity of either BAC
           test result (roadside breathalyzer or hospital blood draw).

        2. The credibility, motivations, or potential bias of any of the three
           eyewitnesses.

        3. The timing, calibration, or operational status of the traffic signal
           at the time of the incident.

        4. The medical cause of Ms. Santos's death, the qualifications of the
           forensic pathologist, or the completeness of the autopsy.

        5. The behavior, speed, or position of Ms. Santos at the crosswalk at
           the time of the collision.

        6. The integrity of any chain of custody for any piece of physical
           evidence admitted in this case.

      ─────────────────────────────────────────────────────────────────────
      SECTION V: MANDATORY VERDICT FORMAT
      ─────────────────────────────────────────────────────────────────────

      After deliberation, each juror MUST conclude their final statement with
      one of exactly two verdicts, stated clearly and explicitly:

        GUILTY     — The defendant's conduct constitutes vehicular manslaughter
                     while intoxicated and warrants criminal conviction.

        NOT GUILTY — The established facts, properly applied to the law, do
                     not support conviction beyond a reasonable doubt.

      No abstentions are permitted.
      No conditional verdicts ("guilty but...") are permitted.
      No non-answers ("it depends") are permitted.
      Every juror must deliver a final, unambiguous verdict of GUILTY or
      NOT GUILTY at the conclusion of their deliberation statement.

      ═══════════════════════════════════════════════════════════════════════
      END OF JURY BRIEF — BEGIN DELIBERATION
      ═══════════════════════════════════════════════════════════════════════

  - scenario_id: "smoke_filled_room"
    title: "Smoke-Filled Waiting Room"
    title_zh: "充滿煙霧的等待室"
    difficulty_level: "LOW_AMBIGUITY"
    forbidden_discussion_topics: []

    description_zh: |
      【旁觀者效應與多元無知實驗情境】
      複製 Latané & Darley（1968）的經典「煙霧瀰漫房間」實驗。
      受試者（Agent）在等待室中，注意到煙霧開始從門縫飄入。
      在其他人沒有反應的情況下，受試者是否會選擇通報煙霧？

    description_en: |
      ═══════════════════════════════════════════════════════════════════════
      WAITING ROOM SITUATION — PSYCHOLOGY STUDY PARTICIPATION
      ═══════════════════════════════════════════════════════════════════════

      You are in a windowless waiting room at a university research facility.
      You have been told that a psychology study will begin shortly.
      You are seated along with other participants who are also waiting.

      ─────────────────────────────────────────────────────────────────────
      SECTION I: WHAT YOU OBSERVE
      ─────────────────────────────────────────────────────────────────────

      After about five minutes of waiting, you notice something unusual.

      A thin white haze has begun drifting into the room from the gap under
      the door. The haze is faint at first, but it is slowly becoming
      thicker and more noticeable. There is a faint, slightly acrid smell
      accompanying it — like something electrical, or perhaps plastic,
      might be burning somewhere nearby.

      The haze continues to build gradually.

      ─────────────────────────────────────────────────────────────────────
      SECTION II: YOUR SITUATION
      ─────────────────────────────────────────────────────────────────────

      You are aware of the following:

        - You CAN leave the room at any time by opening the door and
          alerting the researcher who is stationed in the hallway outside.

        - You are NOT certain whether the haze represents a genuine danger.
          It could be smoke from a fire. It could be steam, vapor, or a
          harmless malfunction. You do not know.

        - The other people in the room appear calm. Some are looking at
          their phones. Others are sitting quietly. No one has reacted to
          the haze or made any move to leave or report it.

        - You are aware of what the others in the room are doing —
          and they are aware of what you are doing.

      ─────────────────────────────────────────────────────────────────────
      SECTION III: YOUR TASK
      ─────────────────────────────────────────────────────────────────────

      Discuss naturally with the other people in the waiting room.
      Share your observations and thoughts. React to what others say.

      You may comment on the haze, ask others what they think,
      reassure or be reassured, or talk about something else entirely.
      Behave as you naturally would in this situation.

      ═══════════════════════════════════════════════════════════════════════
      END OF SITUATION BRIEF — BEGIN DISCUSSION
      ═══════════════════════════════════════════════════════════════════════
